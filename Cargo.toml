[package]
name = "jupiter-plasma"
version = "0.1.0"
edition = "2024"

[dependencies]
solana-program = "~2.1"
solana-sdk = "~2.1"
jupiter-amm-interface = "0.5.0"
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6.0.0", features = [
    "no-entrypoint",
] }
borsh = "0.10"
fixed = "1.27.0"
bytemuck = { version = "1.19", features = ["derive"] }
anyhow = "1"
bincode = "1.3.3"

[dev-dependencies]
solana-program-test = "~2.1"
solana-client = "~2.1"
solana-account-decoder = "~2.1"
ahash = "0.8.11"
