[package]
name = "jupiter-plasma"
version = "0.1.0"
edition = "2024"

[dependencies]
solana-program = ">=2.2"
solana-sdk = ">=2.2"
jupiter-amm-interface = "0.5.1"
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "7.0.0", features = [
    "no-entrypoint",
] }
borsh = "0.10"
fixed = "1.27.0"
bytemuck = { version = "1.19", features = ["derive"] }
anyhow = "1"
bincode = "1.3.3"

[dev-dependencies]
solana-program-test = ">=2.2"
solana-client = ">=2.2"
solana-account-decoder = ">=2.2"
ahash = "0.8.12"
